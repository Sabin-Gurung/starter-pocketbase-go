<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketBase Starter Service</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.8rem; }
    p { color: #94a3b8; line-height: 1.6; }
    a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Go + PocketBase Starter</span>
    <h1>Service Running</h1>
    <p>Your custom PocketBase backend starter service is active and ready.</p>
    <p><a href="/_/" target="_blank">Access PocketBase Admin UI &rarr;</a></p>
  </div>
</body>
</html>
